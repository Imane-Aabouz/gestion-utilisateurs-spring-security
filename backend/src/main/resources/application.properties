spring.application.name=userapi

# --- Base de données : jamais de secret en clair dans le dépôt ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/userdb}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- JWT : secret d'au moins 32 caractères, fourni par variable d'environnement ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Ne pas divulguer les détails d'erreur au client
server.error.include-message=never
server.error.include-stacktrace=never

server.port=8081
